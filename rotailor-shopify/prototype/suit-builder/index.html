<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suit Builder Prototype</title>
<style>
  :root { --bg: #0b0b0b; --panel: #161616; --text: #f2f2f2; --muted: #9a9a92; --accent: #c9a55a; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 24px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  canvas { width: 100%; height: auto; display: block; background: #ddd; }
  fieldset { border: 1px solid #2a2a28; margin: 0 0 12px; padding: 10px 12px; }
  legend { color: var(--accent); font-size: 0.8rem; letter-spacing: 0.1em; }
  label { display: inline-flex; gap: 6px; align-items: center; margin: 4px 12px 4px 0; font-size: 0.9rem; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1px solid #444; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="view" width="768" height="1152" data-ready="0"></canvas>
  <form id="spec">
    <fieldset><legend>ラペル</legend>
      <label><input type="radio" name="lapel" value="notch" checked>ノッチ</label>
      <label><input type="radio" name="lapel" value="peak">ピーク</label>
      <label><input type="radio" name="lapel" value="shawl">ショール</label>
    </fieldset>
    <fieldset><legend>ボタン</legend>
      <label><input type="radio" name="closure" value="sb1">シングル1ボタン</label>
      <label><input type="radio" name="closure" value="sb2" checked>シングル2ボタン</label>
      <label><input type="radio" name="closure" value="sb3">シングル3ボタン段返り</label>
      <label><input type="radio" name="closure" value="db4">ダブル4ボタン</label>
      <label><input type="radio" name="closure" value="db6">ダブル6ボタン</label>
    </fieldset>
    <fieldset><legend>ベスト</legend>
      <label><input type="radio" name="vest" value="0" checked>なし</label>
      <label><input type="radio" name="vest" value="1">あり（シングル6ボタン）</label>
    </fieldset>
    <fieldset><legend>前</legend>
      <label><input type="radio" name="open" value="0" checked>留める</label>
      <label><input type="radio" name="open" value="1">開ける</label>
    </fieldset>
    <fieldset><legend>腰ポケット</legend>
      <label><input type="radio" name="pocket" value="flap" checked>フラップ</label>
      <label><input type="radio" name="pocket" value="flap_ticket">フラップ＋チェンジ</label>
      <label><input type="radio" name="pocket" value="slant">スラント</label>
      <label><input type="radio" name="pocket" value="jetted">両玉縁</label>
      <label><input type="radio" name="pocket" value="patch">パッチ</label>
    </fieldset>
    <fieldset><legend>ベント（後ろ姿）</legend>
      <label><input type="radio" name="vent" value="side" checked>サイド</label>
      <label><input type="radio" name="vent" value="center">センター</label>
      <label><input type="radio" name="vent" value="none">なし</label>
      <label><input type="radio" name="view" value="front" checked>正面</label>
      <label><input type="radio" name="view" value="back">後ろ</label>
    </fieldset>
    <fieldset><legend>ボタン・裾</legend>
      <label><input type="radio" name="buttonColor" value="#2c2019" checked>ダークブラウン</label>
      <label><input type="radio" name="buttonColor" value="#26314A">ネイビー</label>
      <label><input type="radio" name="buttonColor" value="#B8963E">ゴールド</label>
      <label><input type="radio" name="cuff" value="0" checked>シングル裾</label>
      <label><input type="radio" name="cuff" value="1">ダブル裾</label>
    </fieldset>
    <fieldset><legend>靴</legend>
      <label><input type="radio" name="shoeColor" value="#1a1a1a" checked>黒</label>
      <label><input type="radio" name="shoeColor" value="#3b2516">ダークブラウン</label>
      <label><input type="radio" name="shoeColor" value="#7a4a26">ブラウン</label>
      <label><input type="radio" name="shoeColor" value="#a8743f">タン</label>
      <label><input type="radio" name="shoeColor" value="#4a1a22">バーガンディ</label>
    </fieldset>
    <fieldset><legend>生地</legend>
      <label><input type="radio" name="fabric" value="#1F2A44|solid" checked><span class="swatch" style="background:#1F2A44"></span>ネイビー</label>
      <label><input type="radio" name="fabric" value="#3A3C40|solid"><span class="swatch" style="background:#3A3C40"></span>チャコール</label>
      <label><input type="radio" name="fabric" value="#5A4232|solid"><span class="swatch" style="background:#5A4232"></span>ブラウン</label>
      <label><input type="radio" name="fabric" value="#1C2540|pinstripe"><span class="swatch" style="background:#1C2540"></span>ネイビー ピンストライプ</label>
      <label><input type="radio" name="fabric" value="#9A9C9E|check"><span class="swatch" style="background:#9A9C9E"></span>ライトグレー ウィンドウペン</label>
    </fieldset>
    <fieldset><legend>シャツ・ネクタイ</legend>
      <label><input type="radio" name="shirt" value="#F6F6F2" checked>白</label>
      <label><input type="radio" name="shirt" value="#CADBEE">サックス</label>
      <label><input type="radio" name="tie" value="#6B1F2A|birdseye" checked>ボルドー小紋</label>
      <label><input type="radio" name="tie" value="#1E2A4A|solid">ネイビー</label>
    </fieldset>
  </form>
</div>
<script src="../../theme/assets/suit-photo.js"></script>
<script src="../../theme/assets/suit-builder.js"></script>
<script>
  (function () {
    var P = window.RoTailorPhoto, B = window.RoTailorBuilder;
    var canvas = document.getElementById('view');
    var form = document.getElementById('spec');
    function read() {
      var f = new FormData(form);
      var fab = f.get('fabric').split('|'), tie = f.get('tie').split('|');
      return {
        view: f.get('view'),
        spec: { lapel: f.get('lapel'), closure: f.get('closure'), vest: f.get('vest') === '1', open: f.get('open') === '1', pocket: f.get('pocket'), vent: f.get('vent'), cuff: f.get('cuff') === '1', buttonColor: f.get('buttonColor'), shoeColor: f.get('shoeColor') },
        textures: {
          suit: P.patternTexture({ color: fab[0], pattern: fab[1] }, 'suit'),
          shirt: P.patternTexture({ color: f.get('shirt') }, 'shirt'),
          tie: P.patternTexture({ color: tie[0], pattern: tie[1] }, 'tie')
        }
      };
    }
    var basePromise = P.loadBase('front-base', { photo: '../../theme/assets/suit-front-base.jpg', mask: '../../theme/assets/suit-front-base-mask.png' });
    var backPromise = P.loadBase('back-base', { photo: '../../theme/assets/suit-photo-back-n.jpg', mask: '../../theme/assets/suit-photo-back-n-mask.png' });
    function draw(override) {
      Promise.all([basePromise, backPromise]).then(function (bases) {
        var r = read();
        if (override) Object.assign(r.spec, override.spec || {});
        if (r.view === 'back') {
          B.renderBack(canvas, bases[1], r.spec, r.textures);
          canvas.dataset.ready = '1';
          return;
        }
        var g = B.render(canvas, bases[0], r.spec, r.textures);
        // 組み合わせの決まり（ダブル→ピーク等）で変わった選択を画面にも反映
        ['lapel', 'closure'].forEach(function (k) { form.querySelector('input[name=' + k + '][value="' + g.spec[k] + '"]').checked = true; });
        form.querySelector('input[name=open][value="' + (g.spec.open ? 1 : 0) + '"]').checked = true;
        canvas.dataset.ready = '1';
        canvas.dataset.buttons = g.visibleButtons;
      });
    }
    form.addEventListener('change', function () { draw(); });
    window.drawSpec = function (spec, fabric) {
      if (fabric) form.querySelector('input[name=fabric][value="' + fabric + '"]').checked = true;
      Object.keys(spec).forEach(function (k) {
        var v = typeof spec[k] === 'boolean' ? (spec[k] ? '1' : '0') : String(spec[k]);
        form.querySelector('input[name=' + k + '][value="' + v + '"]').checked = true;
      });
      draw();
    };
    draw();
  })();
</script>
</body>
</html>
